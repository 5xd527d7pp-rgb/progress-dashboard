name: Todoレポート自動配信

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 実行モード（preview はメールのみdry-run、HTMLはSurgeへ反映）
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  schedule:
    # 毎週月曜 08:00 JST = 毎週日曜 23:00 UTC
    - cron: '0 23 * * 0'

jobs:
  todo-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run check-todo-report-setup
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        env:
          TODO_REPORT_SMTP_HOST: ${{ secrets.TODO_REPORT_SMTP_HOST }}
          TODO_REPORT_SMTP_PORT: ${{ secrets.TODO_REPORT_SMTP_PORT }}
          TODO_REPORT_SMTP_USER: ${{ secrets.TODO_REPORT_SMTP_USER }}
          TODO_REPORT_SMTP_PASS: ${{ secrets.TODO_REPORT_SMTP_PASS }}
          TODO_REPORT_MAIL_FROM: ${{ secrets.TODO_REPORT_MAIL_FROM }}
          TODO_REPORT_MAIL_TO: ${{ secrets.TODO_REPORT_MAIL_TO }}
          TODO_REPORT_PHONE_LOG_CSV_URL: ${{ secrets.TODO_REPORT_PHONE_LOG_CSV_URL }}
          TODO_REPORT_MAIL_IMAP_HOST: ${{ secrets.TODO_REPORT_MAIL_IMAP_HOST }}
          TODO_REPORT_MAIL_IMAP_PORT: ${{ secrets.TODO_REPORT_MAIL_IMAP_PORT }}
          TODO_REPORT_MAIL_IMAP_SECURE: ${{ secrets.TODO_REPORT_MAIL_IMAP_SECURE }}
          TODO_REPORT_MAIL_IMAP_USER: ${{ secrets.TODO_REPORT_MAIL_IMAP_USER }}
          TODO_REPORT_MAIL_IMAP_PASS: ${{ secrets.TODO_REPORT_MAIL_IMAP_PASS }}
          TODO_REPORT_MAIL_IMAP_MAILBOX: ${{ secrets.TODO_REPORT_MAIL_IMAP_MAILBOX }}
          TODO_REPORT_MAIL_IMAP_FETCH_LIMIT: ${{ secrets.TODO_REPORT_MAIL_IMAP_FETCH_LIMIT }}
          TODO_REPORT_MAIL_IMAP_LOOKBACK_DAYS: ${{ secrets.TODO_REPORT_MAIL_IMAP_LOOKBACK_DAYS }}

      - run: npm run run-todo-report
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        env:
          TODO_REPORT_PHONE_ONLY: '0'
          MAGAZINE_SURGE_LOGIN: ${{ secrets.MAGAZINE_SURGE_LOGIN }}
          MAGAZINE_SURGE_TOKEN: ${{ secrets.MAGAZINE_SURGE_TOKEN }}
          MAGAZINE_SURGE_DOMAIN: ${{ secrets.MAGAZINE_SURGE_DOMAIN }}
          TODO_REPORT_SURGE_LOGIN: ${{ secrets.TODO_REPORT_SURGE_LOGIN }}
          TODO_REPORT_SURGE_TOKEN: ${{ secrets.TODO_REPORT_SURGE_TOKEN }}
          TODO_REPORT_SURGE_DOMAIN: ${{ secrets.TODO_REPORT_SURGE_DOMAIN }}
          TODO_REPORT_PUBLIC_URL: ${{ secrets.TODO_REPORT_PUBLIC_URL }}
          TODO_REPORT_SMTP_HOST: ${{ secrets.TODO_REPORT_SMTP_HOST }}
          TODO_REPORT_SMTP_PORT: ${{ secrets.TODO_REPORT_SMTP_PORT }}
          TODO_REPORT_SMTP_USER: ${{ secrets.TODO_REPORT_SMTP_USER }}
          TODO_REPORT_SMTP_PASS: ${{ secrets.TODO_REPORT_SMTP_PASS }}
          TODO_REPORT_MAIL_FROM: ${{ secrets.TODO_REPORT_MAIL_FROM }}
          TODO_REPORT_MAIL_TO: ${{ secrets.TODO_REPORT_MAIL_TO }}
          TODO_REPORT_PHONE_LOG_CSV_URL: ${{ secrets.TODO_REPORT_PHONE_LOG_CSV_URL }}
          TODO_REPORT_MAIL_IMAP_HOST: ${{ secrets.TODO_REPORT_MAIL_IMAP_HOST }}
          TODO_REPORT_MAIL_IMAP_PORT: ${{ secrets.TODO_REPORT_MAIL_IMAP_PORT }}
          TODO_REPORT_MAIL_IMAP_SECURE: ${{ secrets.TODO_REPORT_MAIL_IMAP_SECURE }}
          TODO_REPORT_MAIL_IMAP_USER: ${{ secrets.TODO_REPORT_MAIL_IMAP_USER }}
          TODO_REPORT_MAIL_IMAP_PASS: ${{ secrets.TODO_REPORT_MAIL_IMAP_PASS }}
          TODO_REPORT_MAIL_IMAP_MAILBOX: ${{ secrets.TODO_REPORT_MAIL_IMAP_MAILBOX }}
          TODO_REPORT_MAIL_IMAP_FETCH_LIMIT: ${{ secrets.TODO_REPORT_MAIL_IMAP_FETCH_LIMIT }}
          TODO_REPORT_MAIL_IMAP_LOOKBACK_DAYS: ${{ secrets.TODO_REPORT_MAIL_IMAP_LOOKBACK_DAYS }}
          TODO_REPORT_DROPBOX_ACCESS_TOKEN: ${{ secrets.TODO_REPORT_DROPBOX_ACCESS_TOKEN }}
          TODO_REPORT_DROPBOX_APP_KEY: ${{ secrets.TODO_REPORT_DROPBOX_APP_KEY }}
          TODO_REPORT_DROPBOX_APP_SECRET: ${{ secrets.TODO_REPORT_DROPBOX_APP_SECRET }}
          TODO_REPORT_DROPBOX_REFRESH_TOKEN: ${{ secrets.TODO_REPORT_DROPBOX_REFRESH_TOKEN }}
          TODO_REPORT_DROPBOX_MEETING_PATH: ${{ secrets.TODO_REPORT_DROPBOX_MEETING_PATH }}
          TODO_REPORT_BUSINESS_EVENTS_ICS_URL: ${{ secrets.TODO_REPORT_BUSINESS_EVENTS_ICS_URL }}

      - run: npm run run-todo-report:preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          TODO_REPORT_PHONE_ONLY: '0'
          TODO_REPORT_PHONE_LOG_CSV_URL: ${{ secrets.TODO_REPORT_PHONE_LOG_CSV_URL }}
          TODO_REPORT_FAIL_ON_WARNINGS: 0
          TODO_REPORT_SURGE_LOGIN: ${{ secrets.TODO_REPORT_SURGE_LOGIN }}
          TODO_REPORT_SURGE_TOKEN: ${{ secrets.TODO_REPORT_SURGE_TOKEN }}
          TODO_REPORT_SURGE_DOMAIN: ${{ secrets.TODO_REPORT_SURGE_DOMAIN }}
          TODO_REPORT_PUBLIC_URL: ${{ secrets.TODO_REPORT_PUBLIC_URL }}
          TODO_REPORT_MAIL_IMAP_HOST: ${{ secrets.TODO_REPORT_MAIL_IMAP_HOST }}
          TODO_REPORT_MAIL_IMAP_PORT: ${{ secrets.TODO_REPORT_MAIL_IMAP_PORT }}
          TODO_REPORT_MAIL_IMAP_SECURE: ${{ secrets.TODO_REPORT_MAIL_IMAP_SECURE }}
          TODO_REPORT_MAIL_IMAP_USER: ${{ secrets.TODO_REPORT_MAIL_IMAP_USER }}
          TODO_REPORT_MAIL_IMAP_PASS: ${{ secrets.TODO_REPORT_MAIL_IMAP_PASS }}
          TODO_REPORT_MAIL_IMAP_MAILBOX: ${{ secrets.TODO_REPORT_MAIL_IMAP_MAILBOX }}
          TODO_REPORT_MAIL_IMAP_FETCH_LIMIT: ${{ secrets.TODO_REPORT_MAIL_IMAP_FETCH_LIMIT }}
          TODO_REPORT_MAIL_IMAP_LOOKBACK_DAYS: ${{ secrets.TODO_REPORT_MAIL_IMAP_LOOKBACK_DAYS }}
          TODO_REPORT_DROPBOX_ACCESS_TOKEN: ${{ secrets.TODO_REPORT_DROPBOX_ACCESS_TOKEN }}
          TODO_REPORT_DROPBOX_APP_KEY: ${{ secrets.TODO_REPORT_DROPBOX_APP_KEY }}
          TODO_REPORT_DROPBOX_APP_SECRET: ${{ secrets.TODO_REPORT_DROPBOX_APP_SECRET }}
          TODO_REPORT_DROPBOX_REFRESH_TOKEN: ${{ secrets.TODO_REPORT_DROPBOX_REFRESH_TOKEN }}
          TODO_REPORT_DROPBOX_MEETING_PATH: ${{ secrets.TODO_REPORT_DROPBOX_MEETING_PATH }}
          TODO_REPORT_BUSINESS_EVENTS_ICS_URL: ${{ secrets.TODO_REPORT_BUSINESS_EVENTS_ICS_URL }}

      - name: Upload generated todo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: todo-report-html
          path: |
            output/todo-report.html
            docs/todo-automation-diagram.html
            docs/todo-report-tool-overview.html
            docs/assets/**
